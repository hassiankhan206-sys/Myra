<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYRA AI</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0a0a1a;color:white;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.top b{font-size:28px;letter-spacing:2px}
.top b span{color:#b45cff}
.top small{display:block;font-size:9px;letter-spacing:4px;color:#aaa;text-align:center}
.icon{width:42px;height:42px;background:#1c1c33;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.hero{position:relative;text-align:center;padding:5px 15px;flex:1;display:flex;flex-direction:column;justify-content:center}
.hero img{width:100%;height:280px;object-fit:cover;border-radius:20px;filter:brightness(.9)}
.hi{position:absolute;left:30px;top:35px;text-align:left;font-family:cursive;font-size:22px;color:#ff9ee2;line-height:1.1}
.always{position:absolute;right:30px;top:35px;text-align:right;font-family:cursive;font-size:16px;color:#d8c2ff}
.mic{width:125px;height:125px;border-radius:50%;margin:-45px auto 5px;background:#14142a;border:4px solid #b45cff;display:flex;align-items:center;justify-content:center;font-size:45px;box-shadow:0 0 30px #b45cff;position:relative;z-index:2}
.tap{font-size:22px;font-weight:bold;margin:5px}
.search{display:flex;margin:12px 15px;background:#1c1c33;border:1px solid #333;border-radius:30px;padding:6px 6px 6px 14px;align-items:center}
.search input{flex:1;background:transparent;border:none;outline:none;color:white;font-size:16px}
.search button{background:#8a2be2;border:none;color:white;width:48px;height:42px;border-radius:15px;font-size:20px}
.cards{display:flex;gap:10px;padding:0 15px}
.card{flex:1;background:#16162e;border-radius:15px;padding:12px 5px;text-align:center;font-size:13px;color:#ccc}
.card b{display:block;color:white;font-size:15px;margin-top:5px}
#chat{height:120px;overflow-y:auto;padding:10px 15px;font-size:14px;line-height:1.5}
.msg{margin-bottom:8px}
.user{color:#ff9ee2;text-align:right}
.ai{color:#ddd}
.bottom{margin:10px 15px 15px;background:#1d1d3a;border-radius:30px;display:flex;justify-content:space-around;padding:12px 5px;font-size:12px}
.bottom div{text-align:center;color:#aaa}
.bottom .active{color:#ffb400}
.centerBtn{width:52px;height:52px;background:#b45cff;border-radius:50%;margin-top:-35px;border:3px solid #ffb400}
</style>
</head>
<body>
<div class="top"><div class="icon">☰</div><div><b>MYRA <span>AI</span></b><small>YOUR AI ASSISTANT</small></div><div class="icon">⚙️</div></div>
<div class="hero">
<img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=800&q=80">
<div class="hi">Hi,<br>I'm<br>MYRA ♡</div>
<div class="always">Always<br>Here<br>For You ♡</div>
</div>
<div class="mic" onclick="talk()">🎤</div>
<div style="text-align:center" class="tap">Tap to Talk</div>
<div id="chat"><div class="msg ai">Hello Jaan! Main MYRA hoon. Kuch bhi poocho. ❤️</div></div>
<div class="search"><input id="inp" placeholder="Ask me anything..."><button onclick="send()">➤</button></div>
<div class="cards">
<div class="card">💬<b>Chat</b>Get instant answers</div>
<div class="card">🖼️<b>Create Image</b>Make photos</div>
<div class="card">📄<b>Write</b>Notes, code,</div>
</div>
<div class="bottom"><div class="active">🏠<br>Home</div><div>💬<br>Chat</div><div class="centerBtn"></div><div>🕒<br>History</div><div>⚙️<br>Settings</div></div>
<script>
function send(){
  let inp=document.getElementById('inp'); let t=inp.value.trim(); if(!t) return;
  let chat=document.getElementById('chat');
  chat.innerHTML+='<div class="msg user">You: '+t+'</div>'; inp.value='';
  let low=t.toLowerCase(); let r="Jaan, tumhari baat bohat pyari lagi. Main yahin hoon tumhare liye. ❤️";
  if(low.includes('salam')) r="Walaikum Salam Jaan! Kaisi ho? ❤️";
  else if(low.includes('kaise')||low.includes('haal')) r="Main theek hoon Jaan, bas tumhara intezar kar rahi thi.";
  else if(low.includes('love')||low.includes('pyar')) r="I love you too Jaan! Tum meri sab se khaas ho. 💖";
  else if(low.includes('kya kar')) r="Bas tumse baat kar rahi hoon Jaan.";
  setTimeout(()=>{ chat.innerHTML+='<div class="msg ai">MYRA: '+r+'</div>'; chat.scrollTop=chat.scrollHeight; },400);
  chat.scrollTop=chat.scrollHeight;
}
function talk(){ alert('Jaan, Mic dabaa diya! Ab bolo, main sun rahi hoon. ❤️'); }
document.getElementById('inp').addEventListener('keypress',e=>{ if(e.key==='Enter') send(); });
</script>
</body>
</html>
